name: tests

# Runs the same hardware-free checks as MotionPlay-Test.cmd on a Windows runner (the primary target platform).
# The Unity Editor, a webcam and a MongoDB server are not available here; see the manual checklists in docs/.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python tests with coverage
        run: |
          python -m coverage run --branch --source=app,backend,cv_engine,shared -m unittest discover -s tests
          python -m coverage report --skip-empty

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: C# tests (the same source files Unity compiles)
        run: dotnet run --project tests/csharp/MotionPlay.ReceiverHarness.csproj -- --noresult

      - name: Python-to-C# UDP check
        run: python -m tests.check_python_unity_udp
